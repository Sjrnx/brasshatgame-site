<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass Hat</title>
<meta name="description" content="Brass Hat, a World War II game in development. Follow along on YouTube and Reddit.">
<meta name="theme-color" content="#0E1E3A">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<style>
  @font-face { font-family: "Jost"; font-weight: 200; font-style: italic; font-display: swap; src: url("fonts/jost-latin-200-italic.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 300; font-style: normal; font-display: swap; src: url("fonts/jost-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/jost-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 800; font-style: normal; font-display: swap; src: url("fonts/jost-latin-800-normal.woff2") format("woff2"); }

  :root {
    --navy: #0E1E3A;
    --paper: #FBF9F3;
    --glass: rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background-color: var(--navy);
    background-image: url("img/background.jpg");
    background-size: cover;
    background-position: center;
    color: var(--paper);
    font-family: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
    text-transform: uppercase;
  }
  @media (max-width: 800px) {
    body { background-image: url("img/background-1200.jpg"); }
  }

  .panel {
    width: clamp(360px, 37.5vw, 720px);
    min-height: 100svh;
    margin: 0 auto;
    background: var(--glass);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 16px;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 0 24px;
  }
  .logo { width: clamp(150px, 40%, 280px); height: auto; display: block; }

  h1 {
    margin: clamp(32px, 9vh, 88px) 0 0;
    font-weight: 800;
    font-size: clamp(40px, 5vw, 80px);
    line-height: 1;
  }
  .status {
    margin: clamp(16px, 3vh, 32px) 0 0;
    font-weight: 500;
    font-size: clamp(16px, 2.1vw, 30px);
    line-height: 1.2;
  }
  .follow {
    margin: clamp(16px, 2.5vh, 28px) 0 0;
    font-weight: 300;
    font-size: clamp(15px, 1.9vw, 27px);
    letter-spacing: 0.02em;
  }

  .links {
    display: flex;
    gap: clamp(20px, 4vw, 64px);
    margin-top: clamp(18px, 3vh, 32px);
    justify-content: center;
    align-items: flex-start;
  }
  .link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 96px;
    color: var(--paper);
    text-decoration: none;
    text-transform: none;
    font-weight: 500;
    font-size: clamp(13px, 0.95vw, 15px);
  }
  .icon {
    height: clamp(40px, 3.75vw, 56px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon img { height: 100%; width: auto; display: block; transition: transform 150ms ease-out; }
  .icon img.yt { height: 88%; }
  a.link:hover .icon img, a.link:focus-visible .icon img { transform: translateY(-3px); }
  a.link:hover span, a.link:focus-visible span { text-decoration: underline; text-underline-offset: 4px; }
  a.link:focus-visible { outline: 2px solid var(--paper); outline-offset: 6px; }

  .soon { opacity: 0.85; }
  .soon span { font-weight: 200; font-style: italic; text-transform: uppercase; font-size: clamp(11px, 0.85vw, 13px); }

  footer {
    padding: 16px 0 24px;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  @media (max-width: 480px) {
    .panel { width: 100%; }
    .links { gap: 12px; }
    .link { min-width: 88px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .icon img { transition: none; }
  }
</style>
</head>
<body>
  <div class="panel">
    <main class="content">
      <img class="logo" src="img/logo.svg" alt="Brass Hat logo" width="280" height="280">
      <h1>Brass Hat</h1>
      <p class="status">In development &middot; Pre-Alpha</p>
      <p class="follow">Follow along:</p>
      <nav class="links" aria-label="Follow Brass Hat">
        <a class="link" href="https://www.youtube.com/@BrassHatGame" target="_blank" rel="noopener">
          <span class="icon"><img class="yt" src="img/youtube.png" alt=""></span>
          <span>@BrassHatGame</span>
        </a>
        <a class="link" href="https://www.reddit.com/r/BrassHat/" target="_blank" rel="noopener">
          <span class="icon"><img src="img/reddit.png" alt=""></span>
          <span>r/BrassHat</span>
        </a>
        <div class="link soon" aria-label="Steam, coming soon">
          <span class="icon"><img src="img/steam.png" alt=""></span>
          <span>Coming soon</span>
        </div>
      </nav>
    </main>
    <footer>Brass Hat &copy; 2026</footer>
  </div>
</body>
</html>
